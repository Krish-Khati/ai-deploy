# GitHub Actions workflow for automated content planning
# This workflow runs daily at 9:00 AM IST (3:30 AM UTC) and can also be triggered manually

name: Content Planner Automation

# Schedule: Run daily at 9:00 AM IST
# IST = UTC+5:30, so 9:00 AM IST = 3:30 AM UTC
# Cron format: minute hour day-of-month month day-of-week
on:
  schedule:
    - cron: '30 3 * * *'  # Runs at 3:30 AM UTC daily (9:00 AM IST)
  # Allow manual triggering from GitHub Actions tab
  workflow_dispatch:

jobs:
  run-content-planner:
    # Use Ubuntu latest runner (comes with Python pre-installed)
    runs-on: ubuntu-latest

    # Environment variables for the job
    # These will be available to all steps in this job
    env:
      # DEVTO_API_KEY from GitHub Secrets (for posting to dev.to)
      DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
      # GROQ_API_KEY from GitHub Secrets (for LLM content generation)
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      # GH_PAT from GitHub Secrets (Personal Access Token for GitHub API)
      # We map it to GITHUB_TOKEN because the Python script expects this env var name
      # Note: GITHUB_TOKEN in GitHub Actions is a reserved name with limited permissions
      # so we use our own PAT with broader repo access
      GITHUB_TOKEN: ${{ secrets.GH_PAT }}

    steps:
      # Step 1: Checkout the repository code
      # This downloads your repo so the workflow can access the Python files
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python 3.11
      # Uses the official GitHub Action for Python setup
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # Cache pip dependencies to speed up subsequent runs
          cache: 'pip'

      # Step 3: Install dependencies from requirements.txt
      # This installs requests, python-dotenv, pytrends, groq, etc.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run the content planner script
      # This executes the main orchestration logic:
      # - Fetches GitHub activity
      # - Generates blog post via Groq LLM
      # - Posts draft to dev.to
      - name: Run content planner
        run: python app/brain/decision_engine.py